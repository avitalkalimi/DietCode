<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SuperDiet – התפריט שלי</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Press+Start+2P&display=swap">
<style>
/* Layout: one-column game "level" — sticky score bar, four meal blocks stacked like platforms, bottom-sheet picker. Single deliberate sky-world look. */
:root{
  --sky:#6FA8FF; --sky-deep:#4A86E8; --cloud:#FFFFFF; --brick:#C84C0C; --brick-dark:#7A2E08;
  --gold:#FBD000; --gold-dark:#B88A00; --grass:#3FA34D; --ink:#2A1606; --paper:#FFF8E7; --muted:#7B6A55;
  --chip:#FFE9A8; --warn:#FFD9C7;
  --display:"Rubik",system-ui,sans-serif; --body:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif; --pixel:"Press Start 2P",ui-monospace,monospace;
  color-scheme:light;
}
html{background:var(--sky)}
body{background:linear-gradient(var(--sky) 0, var(--sky) 60%, #8DBBFF 100%);color:var(--ink);font-family:var(--body);direction:rtl;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brick)}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  background:var(--brick);border-bottom:4px solid var(--brick-dark);
  background-image:linear-gradient(var(--brick-dark) 2px,transparent 2px),linear-gradient(90deg,var(--brick-dark) 2px,transparent 2px);
  background-size:28px 14px;}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px max(16px,env(safe-area-inset-left,0px));max-width:640px;margin:0 auto}
.top h1{margin:0;font-family:var(--display);font-weight:800;font-size:1.15rem;color:#fff;text-shadow:2px 2px 0 var(--brick-dark)}
.logo{display:flex;align-items:center;gap:10px}
.mascot{flex:none;animation:chomp 1.6s steps(2) infinite}
.mascot{display:grid;place-items:center;width:64px;height:64px;background:var(--sky);border:3px solid var(--ink);border-radius:8px;box-shadow:inset -3px -3px 0 var(--sky-deep),2px 2px 0 var(--brick-dark)}
.mascot svg{display:block;width:58px;height:58px}
@keyframes chomp{50%{transform:translateY(-3px)}}
.logo-t{display:flex;flex-direction:column;gap:5px}
.logo-w{font-family:var(--pixel);font-size:1rem;line-height:1;text-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.logo-w b{font-weight:400;color:#fff}
.logo-w i{font-style:normal;color:#E52521;text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff,3px 3px 0 var(--ink)}
.logo small{font-size:.72rem;font-weight:700;color:#FFE3C9;text-shadow:1px 1px 0 var(--brick-dark)}
@media (prefers-reduced-motion:reduce){.mascot{animation:none}}
.score{display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:6px;padding:7px 10px;font-family:var(--pixel);font-size:.7rem;direction:ltr;font-variant-numeric:tabular-nums}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF2A0 0 20%,var(--gold) 21% 70%,var(--gold-dark) 71%);border:2px solid var(--ink);flex:none}

main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:16px}
.intro{background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:12px 14px;box-shadow:4px 4px 0 rgba(42,22,6,.35)}
.intro p{margin:0;line-height:1.5;font-size:.95rem}
.bar{margin-top:10px;height:14px;border:3px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--gold) 0 10px,#FFE35C 10px 20px);transition:width .3s}
.intro small{display:block;margin-top:6px;color:var(--muted);font-size:.8rem}

.meal{background:var(--paper);border:3px solid var(--ink);border-radius:10px;overflow:hidden;box-shadow:4px 4px 0 rgba(42,22,6,.35)}
.meal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--gold);border-bottom:3px solid var(--ink)}
.meal-h h2{margin:0;font-family:var(--display);font-weight:800;font-size:1.1rem;text-wrap:balance}
.meal-h .when{font-size:.78rem;color:var(--ink);opacity:.75;display:block;font-weight:500}
.meal-t{display:flex;align-items:center;gap:10px}
.num{flex:none;width:32px;height:32px;display:grid;place-items:center;background:var(--brick);color:#fff;border:3px solid var(--ink);border-radius:6px;font-family:var(--pixel);font-size:.75rem;text-shadow:1px 1px 0 var(--brick-dark);box-shadow:inset -3px -3px 0 var(--brick-dark)}
.meal-end{display:flex;align-items:center;gap:6px;flex:none}
.time{display:flex;align-items:center;gap:6px;background:var(--sky-deep);color:#fff;border:2px solid var(--ink);border-radius:5px;padding:4px 8px 4px 6px;font-family:var(--pixel);font-size:.65rem;direction:ltr;font-variant-numeric:tabular-nums;text-shadow:1px 1px 0 var(--ink);box-shadow:inset 0 -3px 0 rgba(42,22,6,.3)}
.time::before{content:"";width:12px;height:12px;flex:none;border-radius:50%;background:#fff;border:2px solid var(--ink);background-image:linear-gradient(var(--ink),var(--ink)),linear-gradient(var(--ink),var(--ink));background-repeat:no-repeat;background-size:2px 4px,4px 2px;background-position:4px 1px,4px 4px}
.badge{font-family:var(--pixel);font-size:.6rem;background:var(--ink);color:#fff;border-radius:5px;padding:6px 8px;direction:ltr;white-space:nowrap}
.meal.done .badge{background:var(--grass)}
.parts{display:flex;flex-direction:column}
.favs{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#FFF3CF;border-bottom:2px dashed #E3D3B5;overflow-x:auto;scrollbar-width:thin}
.favs-l{flex:none;font-weight:800;font-size:.85rem}
.favs-e{font-size:.8rem;color:var(--muted)}
.fav{flex:none;display:flex;align-items:stretch;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.fav button{border:0;background:transparent;cursor:pointer;font-size:.85rem;font-weight:600;padding:5px 10px;white-space:nowrap}
.fav button:active{background:var(--chip)}
.fav .del{padding:5px 8px;border-inline-start:2px solid var(--ink);color:var(--muted);font-weight:800}
.fav-add{flex:none;border:2px dashed var(--ink);border-radius:999px;background:transparent;cursor:pointer;font-size:.85rem;font-weight:700;padding:5px 10px;white-space:nowrap}
.fav-add:disabled{opacity:.4;cursor:default}
.part{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:12px 14px;border-top:2px dashed #E3D3B5;background:transparent;border-inline:0;border-bottom:0;text-align:right;cursor:pointer;width:100%;min-height:60px}
.parts .part:first-child{border-top:0}
.part:active{background:#FFF0C9}
.ico{width:34px;height:34px;border-radius:8px;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:.95rem;background:var(--chip)}
.part .lbl{min-width:0}
.part .name{display:block;font-weight:700;font-size:.95rem}
.part .val{display:block;font-size:.88rem;color:var(--muted);margin-top:2px;line-height:1.35;overflow-wrap:anywhere}
.part.filled .val{color:var(--ink)}
.kc{display:inline-block;font-size:.72rem;font-weight:700;color:var(--brick-dark);background:#FFE3C9;border-radius:999px;padding:0 6px;white-space:nowrap;vertical-align:1px}
.ico{background:#fff}
.ico svg{display:block;width:24px;height:24px}.part.filled .ico{background:var(--chip)}
.meal-cal{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:3px solid var(--ink);background:#FFF3CF;font-weight:800;font-size:.9rem}
.meal-cal b{font-family:var(--pixel);font-weight:400;font-size:.75rem;background:var(--ink);color:var(--gold);border-radius:5px;padding:6px 8px;direction:rtl;white-space:nowrap}
.meal-cal.zero b{color:#fff;opacity:.5}
.meal-cal b small{font-family:var(--body);font-weight:700;font-size:.8rem}
.roll{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:10px 14px;border:0;border-top:3px solid var(--ink);background:var(--brick);color:#fff;font-weight:800;font-size:.95rem;cursor:pointer;text-shadow:1px 1px 0 var(--brick-dark);box-shadow:inset 0 -4px 0 var(--brick-dark)}
.roll:active{box-shadow:inset 0 3px 0 var(--brick-dark);padding-top:12px;padding-bottom:8px}
.roll .die{font-size:1.15rem;text-shadow:none}
.meal.rolled .part .val{animation:pop .35s ease-out}
.meal.rolled .roll .die{animation:spin .35s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes spin{from{transform:rotate(-180deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.meal.rolled .part .val,.meal.rolled .roll .die{animation:none}}
.part .go{font-size:.78rem;font-weight:700;border:2px solid var(--ink);border-radius:999px;padding:4px 10px;background:#fff;white-space:nowrap}
.part.filled .go{background:var(--grass);color:#fff}

.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1 1 140px;border:3px solid var(--ink);border-radius:10px;padding:12px;font-weight:700;background:#fff;cursor:pointer;box-shadow:3px 3px 0 rgba(42,22,6,.35)}
.btn.primary{background:var(--grass);color:#fff}
.btn.danger{background:var(--brick);color:#fff}
.confirm{background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-weight:500;z-index:30}
.ground{height:44px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-top:10px;background:var(--brick);
  background-image:linear-gradient(var(--brick-dark) 3px,transparent 3px),linear-gradient(90deg,var(--brick-dark) 3px,transparent 3px);background-size:32px 22px;border-top:6px solid var(--grass)}
footer{max-width:640px;margin:14px auto 0;font-size:.8rem;color:#123;line-height:1.5}
footer a{color:#0B2A66;font-weight:700}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(20,10,0,.45);z-index:20}
.sheet{position:fixed;inset:auto 0 0 0;z-index:21;background:var(--paper);border-top:4px solid var(--ink);border-radius:16px 16px 0 0;max-height:88%;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{padding:12px max(16px,env(safe-area-inset-left,0px)) 10px;border-bottom:3px solid var(--ink);background:var(--gold);border-radius:12px 12px 0 0;display:flex;flex-direction:column;gap:8px}
.sheet-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h h3{margin:0;font-family:var(--display);font-size:1.05rem;font-weight:800}
.sheet-h .note{font-size:.82rem;line-height:1.4}
.x{border:2px solid var(--ink);background:#fff;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer}
#q{width:100%;border:3px solid var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-size:1rem;background:#fff;color:var(--ink)}
.list{overflow-y:auto;padding:6px max(16px,env(safe-area-inset-left,0px)) 16px;-webkit-overflow-scrolling:touch}
.grp{margin:14px 0 6px;font-weight:800;font-size:.85rem;color:var(--brick-dark);letter-spacing:.02em}
.grp small{font-weight:500;color:var(--muted)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:right;background:#fff;border:2px solid #E3D3B5;border-radius:10px;padding:11px 12px;margin-top:6px;cursor:pointer;line-height:1.35}
.opt.sel{border-color:var(--ink);background:#FFF1B8}
.opt span{min-width:0;overflow-wrap:anywhere}
.tag{flex:none;font-size:.7rem;font-weight:700;background:var(--warn);border:1.5px solid var(--brick);color:var(--brick-dark);border-radius:999px;padding:2px 8px;white-space:nowrap}
.empty{padding:20px 0;color:var(--muted);text-align:center}
.clear{margin-top:12px;width:100%;border:2px dashed var(--brick);background:transparent;color:var(--brick-dark);border-radius:10px;padding:10px;font-weight:700;cursor:pointer}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

 {id:"p10",meal:"m4",name:"פתי בר, אגוזי מלך ותותים",picks:{"carb":"2 פתי בר","fat":"3 פקאנים/אגוזי מלך","fruit":"תות שדה – 1 כוס"}},
 {id:"p11",meal:"m5",name:"שקשוקה עם בולגרית",picks:{"carb":"1 פרוסת לחם רגיל","cheese":"1 ביצה","cheese2":"60 גרם גבינה קשה עד 5% (צפתית או בולגרית)","fat":"1 כפית שמן מכל סוג","fruit":"קלמנטינה – 2 בינוניות"}},

 {id:"p13",meal:"m5",name:"פיתה לבנה, ביצה וזיתים",picks:{"carb":"1 פיתה קלה (עד 80 קלוריות ליחידה)","cheese":"2 כפות גבינה 3%-5% מכל סוג (סימפוניה, קוטג', לבנה וכדומה)","cheese2":"1 ביצה","fat":"6 זיתים קטנים","fruit":"ענבים – 1 כוס"}}];
(()=>{let seen=[];try{seen=JSON.parse(localStorage.getItem(FKEY+"-presets")||"[]")}catch(e){}
  PRESETS.forEach(f=>{if(seen.includes(f.id))return;(favs[f.meal]=favs[f.meal]||[]).push({name:f.name,picks:{...f.picks}});seen.push(f.id)});
  saveFavs();try{localStorage.setItem(FKEY+"-presets",JSON.stringify(seen))}catch(e){}})();

const LIMIT=/\((עד פעמיים בשבוע|מוגבל לפעם בשבוע|פעם ביום|עד פעם ביום|רצוי לא כל יום)\)/;
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const $=id=>document.getElementById(id);
// 12x12 pixel-art icons, one char per pixel ("." = empty)
const PAL={k:"#2A1606",r:"#E52521",w:"#FFFFFF",y:"#FBD000",o:"#E08A00",g:"#3FA34D",s:"#FFD8A8"};
const SPR={
 coin:["....kkkk....","...kyyyyk...","..kyywyyyk..",".kyywyoyyyk.",".kywyyoyyok.",".kywyyoyyok.",".kywyyoyyok.",".kywyyoyyok.",".kyyyyoyyok.","..kyyyyyok..","...kooook...","....kkkk...."],
 mush:["....kkkk....","..kkrrwwkk..",".krrrrwwwrk.",".kwwrrrrrrk.","kwwwwrrrwwrk","kwwwrrrwwwwk","krrrrrrrwwrk","kkkkkkkkkkkk",".kssksskssk.",".kssksskssk.",".kssssssssk.","..kkkkkkkk.."],
 block:["kkkkkkkkkkkkkkkk","kyyyyyyyyyyyyyok","kykyyyyyyyyyykok","kyyyykkkkkkyyyok","kyyykkyyyykkyyok","kyyykkyyyykkyyok","kyyyyyyyykkkyyok","kyyyyyykkkyyyyok","kyyyyyykkyyyyyok","kyyyyyykkyyyyyok","kyyyyyyyyyyyyyok","kyyyyyykkyyyyyok","kyyyyyykkyyyyyok","kykyyyyyyyyyykok","kooooooooooooook","kkkkkkkkkkkkkkkk"],
 star:[".....kk.....","....kyyk....","....kyyk....","kkkkyyyykkkk","kyyyyyyyyyyk",".kyykyykyyk.","..kykyykyk..","..kyyyyyyk..",".kyyyyyyyyk.",".kyyykkyyyk.","kyykk..kkyyk","kkk......kkk"],
 flower:["..kkkkkkkk..",".kooyyyyook.","kooywwwwyook","kooywwwwyook",".kooyyyyook.","..kkkkkkkk..",".....gg.....","gg...gg...gg","ggg..gg..ggg",".gggggggggg.","..gggggggg..","....gggg...."]
};
const SVG={};
const sprite=n=>{
  if(!SPR[n])return esc(n);
  if(!SVG[n]){let r="";SPR[n].forEach((row,y)=>[...row].forEach((c,x)=>{if(PAL[c])r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${PAL[c]}"/>`}));
    SVG[n]=`<svg viewBox="0 0 ${SPR[n][0].length} ${SPR[n].length}" shape-rendering="crispEdges">${r}</svg>`}
  return SVG[n];
};
function render(){
  const wrap=$("meals");wrap.innerHTML="";
  let done=0;
  MEALS.forEach((m,i)=>{
    const filled=m.parts.filter(p=>picks[m.id+":"+p]).length;done+=filled;
    const sec=document.createElement("section");
    sec.className="meal"+(filled===m.parts.length?" done":"");
    sec.innerHTML=`<div class="meal-h"><div class="meal-t"><span class="num" aria-hidden="true">${i+1}</span><div><h2>${m.name}</h2><span class="when">${m.when}</span></div></div><div class="meal-end"><span class="time" aria-label="שעה ${m.time}">${m.time}</span><span class="badge">${filled}/${m.parts.length}</span></div></div><div class="parts"></div>`;
    const parts=sec.querySelector(".parts");
    sec.insertBefore(favRow(m,filled===m.parts.length),parts);
    m.parts.forEach(p=>{
      const L=LISTS[p],v=picks[m.id+":"+p];
      const b=document.createElement("button");b.type="button";b.className="part"+(v?" filled":"");
      b.innerHTML=`<span class="ico" aria-hidden="true">${sprite(L.ico)}</span><span class="lbl"><span class="name">${L.name}</span><span class="val">${v?esc(v)+(kc(v)?` <small class="kc">${kc(v)} קל'</small>`:""):"עדיין לא נבחר"}</span></span><span class="go">${v?"שינוי":"בחירה"}</span>`;
      b.addEventListener("click",()=>openSheet(m,p));
      parts.appendChild(b);
    });
    const mc=m.parts.reduce((t,p)=>t+(kc(picks[m.id+":"+p])||0),0);
    const tot=document.createElement("div");tot.className="meal-cal"+(mc?"":" zero");
    tot.innerHTML=`<span>סה״כ בארוחה</span><b>${mc} <small>קל'</small></b>`;
    sec.appendChild(tot);
    const r=document.createElement("button");r.type="button";r.className="roll";
    r.innerHTML=`<span class="die" aria-hidden="true">🎲</span>${filled?"הגרלה מחדש":"הגרלה אקראית"}`;
    r.addEventListener("click",()=>roll(m));
    sec.appendChild(r);
    if(m.id===rolled){sec.classList.add("rolled");rolled=null}
    wrap.appendChild(sec);
  });
  wrap.style.display="flex";wrap.style.flexDirection="column";wrap.style.gap="18px";
  $("score").textContent=done+"/"+TOTAL;
  $("bar").style.width=(done/TOTAL*100)+"%";
  const cal=Object.entries(picks).filter(([k])=>MEALS.some(m=>m.parts.some(p=>k===m.id+":"+p))).reduce((t,[,v])=>t+(kc(v)||0),0);
  $("status").textContent=(cal?`~${cal.toLocaleString()} קל' · `:"")+(done===0?"אין עדיין בחירות להיום":done===TOTAL?"כל המנות של היום נבחרו. כל הכבוד!":`נבחרו ${done} מתוך ${TOTAL} מנות היום`);
}

function favRow(m,full){
  const row=document.createElement("div");row.className="favs";
  row.innerHTML=`<span class="favs-l">⭐ מועדפים</span>`;
  const list=favs[m.id]||[];
  if(!list.length){const e=document.createElement("span");e.className="favs-e";e.textContent="אין עדיין – מלאי את הארוחה ושמרי";row.appendChild(e)}
  list.forEach((f,i)=>{
    const c=document.createElement("span");c.className="fav";
    c.innerHTML=`<button type="button" title="${esc(m.parts.map(p=>LISTS[p].name+": "+(f.picks[p]||"-")).join("\n"))}">${esc(f.name)}</button><button type="button" class="del" aria-label="מחיקת ${esc(f.name)}">×</button>`;
    c.firstChild.addEventListener("click",()=>{m.parts.forEach(p=>{if(f.picks[p])picks[m.id+":"+p]=f.picks[p]});rolled=m.id;save();render();toast("נבחר מועדף: "+f.name)});
    c.lastChild.addEventListener("click",()=>{if(!confirm(`למחוק את "${f.name}" מהמועדפים?`))return;list.splice(i,1);saveFavs();render()});
    row.appendChild(c);
  });
  const add=document.createElement("button");add.type="button";add.className="fav-add";add.textContent="+ שמירה";
  add.disabled=!full;add.title=full?"שמירת הבחירה הנוכחית כמועדף":"צריך לבחור את כל הרכיבים קודם";
  add.addEventListener("click",()=>{
    const cur={};m.parts.forEach(p=>cur[p]=picks[m.id+":"+p]);
    if(list.some(f=>m.parts.every(p=>f.picks[p]===cur[p]))){toast("הארוחה הזאת כבר במועדפים");return}
    const name=(prompt("איך לקרוא לארוחה המועדפת?","מועדף "+(list.length+1))||"").trim();if(!name)return;
    (favs[m.id]=list).push({name,picks:cur});saveFavs();render();toast("נשמר במועדפים: "+name);
  });
  row.appendChild(add);
  return row;
}

// Random fill: any item in the list, no repeats within the meal, and a different result from the current pick when possible.
let rolled=null;
const pool=p=>LISTS[p].groups.flatMap(g=>g.items);
function roll(m){
  const used=new Set();
  m.parts.forEach(p=>{
    const key=m.id+":"+p;
    let opts=pool(p).filter(i=>!used.has(i));
    const fresh=opts.filter(i=>i!==picks[key]);if(fresh.length)opts=fresh;
    const v=opts[Math.floor(Math.random()*opts.length)];
    picks[key]=v;used.add(v);
  });
  rolled=m.id;save();render();toast("הוגרלה "+m.name);
}

let cur=null;
function openSheet(m,p){
  cur={m,p};const L=LISTS[p];
  $("sheetTitle").textContent=`${L.name} · ${m.name}`;
  $("sheetNote").textContent=L.note;
  $("q").value="";drawList();
  $("scrim").hidden=false;$("sheet").hidden=false;document.body.style.overflow="hidden";
  setTimeout(()=>$("list").scrollTop=0,0);
}
function closeSheet(){$("scrim").hidden=true;$("sheet").hidden=true;document.body.style.overflow="";cur=null}
function drawList(){
  const {m,p}=cur,L=LISTS[p],q=$("q").value.trim(),key=m.id+":"+p,sel=picks[key];
  const list=$("list");list.innerHTML="";let n=0;
  L.groups.forEach(g=>{
    const items=g.items.filter(i=>!q||i.includes(q));if(!items.length)return;
    const h=document.createElement("div");h.className="grp";h.innerHTML=esc(g.g)+(g.n?` <small>· ${esc(g.n)}</small>`:"");list.appendChild(h);
    items.forEach(i=>{
      n++;const m2=i.match(LIMIT);const label=m2?i.replace(LIMIT,"").replace(/\s+$/,""):i;
      const tag=m2?m2[1]:(g.w?g.n:"");
      const b=document.createElement("button");b.type="button";b.className="opt"+(sel===i?" sel":"");
      b.innerHTML=`<span>${esc(label)}${kc(i)?` <small class="kc">${kc(i)} קל'</small>`:""}</span>${tag?`<em class="tag">${esc(tag)}</em>`:""}`;
      b.addEventListener("click",()=>{picks[key]=i;save();render();closeSheet();toast("נבחר: "+label)});
      list.appendChild(b);
    });
  });
  if(!n){const e=document.createElement("div");e.className="empty";e.textContent="לא נמצאה מנה בשם הזה. נסה מילה אחרת.";list.appendChild(e)}
  if(sel){const c=document.createElement("button");c.type="button";c.className="clear";c.textContent="ניקוי הבחירה";
    c.addEventListener("click",()=>{delete picks[key];save();render();closeSheet()});list.appendChild(c)}
}
let tt;function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,1800)}

$("q").addEventListener("input",drawList);
$("close").addEventListener("click",closeSheet);
$("scrim").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&cur)closeSheet()});
$("reset").addEventListener("click",()=>{$("confirm").hidden=false;$("actions").hidden=true});
$("no").addEventListener("click",()=>{$("confirm").hidden=true;$("actions").hidden=false});
$("yes").addEventListener("click",()=>{picks={};save();render();$("confirm").hidden=true;$("actions").hidden=false;toast("התחלנו יום חדש")});
$("copy").addEventListener("click",()=>{
  const txt=MEALS.map((m,i)=>(i+1)+". "+m.name+" ("+m.time+")\n"+m.parts.map(p=>"- "+LISTS[p].name+": "+(picks[m.id+":"+p]?picks[m.id+":"+p]+(kc(picks[m.id+":"+p])?" ("+kc(picks[m.id+":"+p])+" קל')":""):"לא נבחר")).join("\n")).join("\n\n");
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("התפריט הועתק")}catch(e){toast("סמן והעתק ידנית")}ta.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast("התפריט הועתק"),fallback)}else fallback();
});
render();
</script>
